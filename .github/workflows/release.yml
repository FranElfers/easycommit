name: Release

# Pushing a tag such as v0.1.0 publishes a GitHub Release with the static binary.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check test
      - name: Build
        run: |
          make build VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          mv easycommit dist/easycommit-linux-x86_64
          cd dist && sha256sum easycommit-linux-x86_64 > easycommit-linux-x86_64.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
